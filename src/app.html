<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#4f46e5" />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="48x48" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon-180x180.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<!-- Applies the theme before first paint (see src/lib/shared/theme.svelte.ts). Inline to save a
		request before first paint; the build allows it in the CSP by hash (scripts/postbuild-csp.mjs). -->
		<script>
			try {
				var mode = JSON.parse(localStorage.getItem('smthng:theme') || '"system"');
				var dark =
					mode === 'dark' ||
					(mode !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
				document.documentElement.dataset.theme = dark ? 'dark' : 'light';
				var palette = JSON.parse(localStorage.getItem('smthng:palette') || '"default"');
				if (/^(terracotta|graphite|petrol|plum|moss)$/.test(palette))
					document.documentElement.dataset.palette = palette;
			} catch {
				document.documentElement.dataset.theme = 'light';
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
